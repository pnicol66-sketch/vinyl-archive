<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}} · Vinyl Curator</title>
<meta name="description" content="{{META_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="icon" href="{{ROOT}}favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ROOT}}assets/site.css?v={{VCSS}}">
</head>
<body class="lib">
<header class="site-head">
{{NAV}}
</header>
<main class="archive">
  <section class="archive-head">
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{PAGE_TITLE}}</h1>
    <p class="lede">{{LEDE}}</p>
  </section>
  <section class="controls">
    <div class="searchrow">
      <input id="filter" type="search"
        placeholder="Filter by artist, title, label, year, genre…" aria-label="Filter the archive">
      <span class="count" id="count" data-total="{{TOTAL}}">{{COUNT}}</span>
    </div>
{{CONTROLS}}
  </section>
  <section class="card-grid" id="cards">
{{CARDS}}
  </section>
  <p class="no-match" id="nomatch" hidden>Nothing matches that filter.</p>
  <p class="archive-foot">A documented collection — Vinyl Curator.</p>
</main>
<footer class="site-foot">
  <p class="colophon">Documented with <a href="{{ROOT}}">Vinyl Curator</a> ·
  <a class="mail" data-u="{{MAIL_U}}" data-d="{{MAIL_D}}">contact</a> ·
  Updated {{GENERATED}} · © {{YEAR}} Vinyl Curator</p>
</footer>
<script src="{{ROOT}}assets/site.js?v={{VJS}}"></script>
</body>
</html>
